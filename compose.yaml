services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ELF_POSTGRES_DB:-elf}
      POSTGRES_USER: ${ELF_POSTGRES_USER:-elf}
      POSTGRES_PASSWORD: ${ELF_POSTGRES_PASSWORD:?Set ELF_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ELF_POSTGRES_PORT:-5432}:5432"
    volumes:
      - elf-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  elf:
    image: ${ELF_IMAGE:-ediwang/elf:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
      Database__Provider: PostgreSql
      ConnectionStrings__ElfDatabase: "Host=postgres;Port=5432;Database=${ELF_POSTGRES_DB:-elf};Username=${ELF_POSTGRES_USER:-elf};Password=${ELF_POSTGRES_PASSWORD:?Set ELF_POSTGRES_PASSWORD in .env}"
      DefaultRedirectionUrl: ${ELF_DEFAULT_REDIRECTION_URL:-https://edi.wang}
      FeatureManagement__AllowSelfRedirection: ${ELF_ALLOW_SELF_REDIRECTION:-false}
      FeatureManagement__EnableTracking: ${ELF_ENABLE_TRACKING:-true}
      RateLimit__AutoReplenishment: "true"
      RateLimit__PermitLimit: "5"
      RateLimit__WindowSeconds: "1"
      RateLimit__QueueLimit: "0"
      ForwardedHeaders__Enabled: "true"
      Authentication__Provider: ${ELF_AUTH_PROVIDER:-Local}
      Authentication__Local__BootstrapUsername: ${ELF_ADMIN_USERNAME:-admin}
      Authentication__Local__BootstrapPassword: ${ELF_ADMIN_PASSWORD:-}
      Authentication__Totp__Enabled: "true"
      Authentication__Totp__Issuer: Elf
      Authentication__OpenIdConnect__Authority: ${ELF_OIDC_AUTHORITY:-}
      Authentication__OpenIdConnect__ClientId: ${ELF_OIDC_CLIENT_ID:-}
      Authentication__OpenIdConnect__ClientSecret: ${ELF_OIDC_CLIENT_SECRET:-}
      ForwarderBaseUrl: ${ELF_FORWARDER_BASE_URL:-https://go.edi.wang}
    ports:
      - "127.0.0.1:${ELF_APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  elf-postgres-data:
